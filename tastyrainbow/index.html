// main is yellow because it returns an int
pub fn main() {
  io.println("Hello, Joe!")
  let n = {3.4 +. 3.5} *. 1.2
  let _n = float.round(n +. 0.5)
  let _n = None
  let _n = Ok(4)
  echo add(1, float.round(2.3))
  let _n = ABC
  echo x_to_string(ABC)
  let line = "Go placidly amid the noise and the haste"
  let words = string.split(line, " ")
  let _n = find_word(words, "Go")
  let _n = find_word(words, "Gleam")
  let _num_words = list.length(words)
  let long_or_none = list.map(words, long_word)
  echo long_or_none
  let _none_count = long_or_none |> list.filter(fn(x){x == None}) |> list.length
  let long_words = long_or_none |> list.filter_map(fn(opt){
    case opt {
      None -> Error(Nil)

pub fn add(x, y){
  echo "adding"
  x + y
}

pub fn find_word(words, word){
   list.find(words, fn(x){
     string.lowercase(x) == string.lowercase(word)
   })
}

const long_word_size = 5

pub fn long_word(word){
  case string.length(word) < long_word_size {
    True -> None
    False -> Some(word)
  }
}

pub type Wibble {
  ABC
  XYZ
}

pub fn x_to_string(in: Wibble){
  echo ABC
  case in {
    ABC -> "ABC"
    XYZ -> "surprise"
  }
}

pub type Wobble {
  Cow(x: Int, y: Int, z: Int, radius: Float)
  Fence(x1: Int, y1: Int, x2: Int, y2: Int)
}
